name: Java CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with tests
        run: mvn --batch-mode verify

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Release prepare
        run: |
          git config --global user.email "${{ secrets.USER_EMAIL }}"
          git config --global user.name "${{ secrets.USER_NAME }}"
          mvn -B release:prepare
      - name: Copy target files
        run: mkdir staging && cp target/${{ secrets.TARGET_FILE_NAME }} staging
      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: staging
      - name: Upload to S3
        run: |
          aws s3 cp target/${{ secrets.TARGET_FILE_NAME }} s3://${{ secrets.AWS_S3_BUCKET }}
          aws lambda update-function-code \
          --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
          --s3-bucket ${{ secrets.AWS_S3_BUCKET }} \
          --s3-key ${{ secrets.TARGET_FILE_NAME }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      - name: Release perform
        run: |
          mvn -B release:perform -Darguments="-Dmaven.deploy.skip=true"
